# BLACKHOLE Terminal — Render.com Blueprint (free tier).
#
# Render reads this file when you create a Blueprint instance:
#   Dashboard → New + → Blueprint → pick iain504/blackhole-terminal → Apply
# Everything below is the app web service only. Deploy story:
#
#   • runtime: docker — builds the repo Dockerfile (multi-stage bun, Next
#     standalone, boot-time `prisma db push` via docker-entrypoint.sh).
#   • PORT — Render injects it and the standalone server binds it (the
#     Dockerfile/entrypoint already honor $PORT), so no port config needed.
#   • AUTH_SECRET / APP_ENCRYPTION_SECRET use generateValue: Render mints a
#     random 24-char value ONCE and keeps it stable across every later deploy
#     — exactly what the encryption-at-rest design needs (a rotating key
#     would make previously-encrypted TOTP secrets undecryptable).
#   • BUN_JSC_forceRamSize=256MB steers Bun's JavaScriptCore heap heuristic —
#     the V8-style NODE_OPTIONS=--max-old-space-size flag is SILENTLY IGNORED
#     by Bun (verified: the reported limit is JSC's ~345MB default either way).
#   • MEM_RSS_CEILING_MB=460 makes memoryGuard() watch process RSS: the free
#     container is kernel-OOM-killed when RSS crosses 512MB, and a cgroup
#     SIGKILL is silent — no log lines, the pod vanishes, Render's router
#     answers 502 until the restart backoff lands. With the ceiling set, deep
#     1m backtests/sweeps 503-and-retry like on the dev box instead of dying.
#   • ALLOW_REGISTRATION=true so you can create the first account (the
#     bootstrap-open-when-empty rule also applies, but explicit is clearer).
#
# FREE-TIER CONSTRAINTS (read before relying on it):
#   1. EPHEMERAL DISK — the free plan has no persistent disks. db/custom.db
#      lives in the container layer and is RESET on every deploy and every
#      restart. Fine for trying the terminal; accounts/grids/algo history do
#      not survive. Persistence needs plan: starter + the disk block below.
#   2. SPIN-DOWN — free services sleep after 15 minutes without inbound
#      traffic and cold-start in ~50s on the next request. The grid and algo
#      engines tick IN-PROCESS, so while the instance sleeps your grids are
#      NOT being managed. Always-on needs plan: starter.
#   3. 750 instance-hours/month shared across free services — one
#      always-on-ish web service fits; two would not.
#   4. The stream sidecar (socket.io :3030) is deliberately NOT deployed: the
#      browser client connects via the sandbox gateway path
#      (/?XTransformPort=3030) and the free pool can't spare a second
#      always-on service. Without it the terminal works over REST polling —
#      the Live chip shows amber "Reconnecting" and live-tick streaming is
#      simply absent. Grid/algo engines are server-side and unaffected.

services:
  - type: web
    name: blackhole-terminal
    runtime: docker
    plan: free
    region: frankfurt # pick the region closest to you at apply time
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      # Must stay under /app (the only writable location in the container).
      # A host path like file:/home/z/my-project/db/custom.db makes Prisma
      # fail with "Error code 14: Unable to open the database file". Since
      # Task 13 the entrypoint self-heals to /app/db with a loud boot log,
      # but the clean value is this default — or simply delete the var.
      - key: DATABASE_URL
        value: file:/app/db/custom.db
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_SECRET
        generateValue: true
      - key: ALLOW_SHARED_BROKER
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      # Paste your Alpaca PAPER keys in the dashboard (Environment tab) —
      # kept out of git on purpose.
      - key: APCA_API_KEY_ID
        sync: false
      - key: APCA_API_SECRET_KEY
        sync: false
      # Bun/JSC heap steering (NODE_OPTIONS alone is ignored by Bun — see
      # mem-guard.ts); kept for any Node-context tools in the image.
      - key: BUN_JSC_forceRamSize
        value: "268435456" # 256MB
      - key: NODE_OPTIONS
        value: --max-old-space-size=256
      # RSS-aware memory guard — the metric the 512MB container actually dies
      # on. Heavy endpoints return 503 before the kernel OOM-kills the pod.
      - key: MEM_RSS_CEILING_MB
        value: "460"

    # PERSISTENCE (paid plans only — uncomment together with plan: starter):
    # disks:
    #   - name: blackhole-db
    #     mountPath: /app/db
    #     sizeGB: 1
